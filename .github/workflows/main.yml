name: Build Android APK con Capacitor
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Construir o Localizar Archivos Web Reales
        run: |
          # Si tu repositorio ya tiene un package.json (React, Vite, etc.), intenta compilarlo
          if [ -f "package.json" ]; then
            npm install
            npm run build || true
          fi

          mkdir -p www_final

          # Busca en qué carpeta se encuentra tu archivo index.html real
          INDEX_PATH=$(find . -maxdepth 3 -name "index.html" -not -path "./www_final/*" | head -n 1)

          if [ -n "$INDEX_PATH" ]; then
            SOURCE_DIR=$(dirname "$INDEX_PATH")
            echo "Archivos encontrados en: $SOURCE_DIR"
            cp -r "$SOURCE_DIR"/* www_final/
          else
            # Si no hay index.html, copia todos los archivos visibles del repositorio
            cp -r * www_final/ 2>/dev/null || true
          fi

      - name: Configurar Proyecto Web y Android
        run: |
          # Asegura que exista package.json para Capacitor
          if [ ! -f "package.json" ]; then npm init -y; fi
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "App Laparoscopica" "com.yisusomgtfs.laparoscopica" --web-dir=www_final
          npx cap add android
          npx cap sync

      - name: Actualizar Gradle a 8.7
        run: |
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-.*-bin.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Compilar APK Nativo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: App-Laparoscopica-APK
          path: android/app/build/outputs/apk/debug/*.apk
