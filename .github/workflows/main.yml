name: Build Android APK con Capacitor
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Proyecto Web y Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npx cap init "App Laparoscopica" "com.yisusomgtfs.laparoscopica" --web-dir=.
          npm install @capacitor/android
          npx cap add android
          npx cap sync

      - name: Compilar APK Nativo
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: App-Laparoscopica-APK
          path: android/app/build/outputs/apk/debug/*.apk
