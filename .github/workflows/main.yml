name: Build Android APK con Capacitor
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Organizar Archivos Web
        run: |
          mkdir -p www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec cp {} www/ \;
          if [ ! -f www/index.html ]; then echo "<html><head><title>App</title></head><body>Actividad Laparoscópica</body></html>" > www/index.html; fi

      - name: Configurar Proyecto Web y Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "App Laparoscopica" "com.yisusomgtfs.laparoscopica" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Actualizar Gradle a 8.7
        run: |
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-.*-bin.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Compilar APK Nativo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: App-Laparoscopica-APK
          path: android/app/build/outputs/apk/debug/*.apk
